name: baseline_raw

model:
  backbone: resnet50
  num_classes: 3
  pretrained: true
  min_size: 800
  max_size: 1333

data:
  root: data/line2voc
  train_split: train
  val_root: data/line2voc
  val_split: test          # test is the only split with no overlap against any training set
  hflip: 0.5               # box-aware; see src/sonar/data/transforms.py

train:
  epochs: 20
  batch_size: 8
  optimizer: adamw
  lr: 2.0e-4
  weight_decay: 1.0e-4
  clip_grad_norm: 5.0
  amp: true
  seed: 1337
  num_workers: 4
