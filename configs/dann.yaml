name: dann

mode: dann

model:
  backbone: resnet50
  num_classes: 3
  pretrained: true
  min_size: 800
  max_size: 1333

data:
  source_root: data/line2voc_preprocessed   # labelled, median filtered
  target_root: data/line2voc                # unlabelled, raw
  train_split: train
  val_root: data/line2voc
  val_split: val
  hflip: 0.5

adaptation:
  dann_lambda: 0.20
  feature_level: "0"

train:
  epochs: 20
  batch_size: 12
  optimizer: sgd
  lr: 1.0e-3
  disc_lr: 2.0e-3
  momentum: 0.9
  weight_decay: 5.0e-4
  clip_grad_norm: 5.0
  amp: true
  seed: 1337
  num_workers: 4

