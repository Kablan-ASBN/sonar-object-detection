[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonar-object-detection"
version = "0.2.0"
description = "Object and shadow detection in sidescan sonar under domain shift"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Research use only" }
authors = [{ name = "Kablan Assebian" }]

dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    # The [detection] extra is what pulls pycocotools; MeanAveragePrecision raises
    # ModuleNotFoundError at construction time without it.
    "torchmetrics[detection]>=1.2",
    # torch caps at 2.2 on Intel macOS, which predates numpy 2 support. Everywhere else
    # (Colab, Linux CI, Apple silicon) numpy 2 is fine and pinning below it downgrades
    # the runtime's numpy out from under packages built against it.
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "opencv-python-headless",
    "pillow",
    "pandas",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff>=0.4"]
plots = ["matplotlib"]

[project.scripts]
sonar = "sonar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",    # function call in default argument - fine for dataclass field defaults
    "RUF012",  # mutable class attrs need ClassVar - noisy for dataclasses
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
