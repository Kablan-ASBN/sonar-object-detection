[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonar-object-detection"
version = "0.2.0"
description = "Object and shadow detection in sidescan sonar under domain shift"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Research use only" }
authors = [{ name = "Gomis Kablan Assebian" }]

dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    # The [detection] extra is what pulls pycocotools; MeanAveragePrecision raises
    # ModuleNotFoundError at construction time without it.
    "torchmetrics[detection]>=1.2",
    "numpy<2",
    "opencv-python-headless",
    "pillow",
    "pandas",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff>=0.4"]
plots = ["matplotlib"]

[project.scripts]
sonar = "sonar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",    # function call in default argument - fine for dataclass field defaults
    "RUF012",  # mutable class attrs need ClassVar - noisy for dataclasses
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
